site_name: Hibernation Operator
docs_dir: content
site_url: https://docs.stakater.com/hibernation-operator-docs
repo_url: https://github.com/stakater/hibernation-operator-docs
edit_uri: blob/main/content/
theme:
  favicon: assets/images/favicon.svg

strict: true
validation:
  links:
    anchors: warn

# Redirects for pages relocated during the docs restructure, so old bookmarks
# keep working. Requires the `mkdocs-redirects` package at build time — see the
# note in docs/superpowers/shared-theme-redirects.md (must be added to the
# shared theme's requirements.txt).
plugins:
  - redirects:
      redirect_maps:
        about/key-features.md: overview/key-features.md
        about/use-cases.md: overview/use-cases.md
        about/benefits.md: overview/benefits.md
        architecture/architecture.md: concepts/architecture.md
        architecture/concepts.md: concepts/terminology.md
        installation/overview.md: getting-started/installation/overview.md
        installation/openshift.md: getting-started/installation/openshift.md
        installation/kubernetes.md: getting-started/installation/kubernetes.md
        how-to-guides/create-resource-supervisor.md: guides/create-resource-supervisor.md
        how-to-guides/create-cluster-resource-supervisor.md: guides/create-cluster-resource-supervisor.md
        how-to-guides/hibernate-resources.md: guides/hibernate-resources.md
        kubernetes-resources/resource-supervisor.md: reference/api/resource-supervisor.md
        kubernetes-resources/cluster-resource-supervisor.md: reference/api/cluster-resource-supervisor.md
        changelog.md: release-notes.md

extra:
  version:
    provider: mike
    default: latest

nav:
  - Overview:
    - Introduction: index.md
    - overview/key-features.md
    - overview/use-cases.md
    - overview/benefits.md
  - Concepts:
    - concepts/architecture.md
    - concepts/terminology.md
  - Getting Started:
    - getting-started/quick-start.md
    - Installation:
      - getting-started/installation/overview.md
      - getting-started/installation/openshift.md
      - getting-started/installation/kubernetes.md
    - getting-started/uninstalling.md
  - Guides:
    - guides/create-resource-supervisor.md
    - guides/create-cluster-resource-supervisor.md
    - guides/hibernate-resources.md
  - Integrations:
    - integrations/argocd.md
  - Reference:
    - API Reference:
      - reference/api/resource-supervisor.md
      - reference/api/cluster-resource-supervisor.md
    - reference/configuration.md
    - reference/rbac.md
    - reference/metrics.md
    - reference/webhooks.md
    - reference/security-model.md
  - Troubleshooting:
    - troubleshooting.md
  - Release Notes:
    - release-notes.md
  - EULA:
    - eula.md
