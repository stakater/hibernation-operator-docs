name: Pull Request

on:
  pull_request:
    branches:
      - "main"
      - "[0-9]+.[0-9]+"

jobs:
  doc_qa:
    uses: stakater/.github/.github/workflows/pull_request_doc_qa.yaml@v0.0.131
    with:
      MD_CONFIG: .github/md_config.json
      DOC_SRC: content README.md
      MD_LINT_CONFIG: .markdownlint.yaml
  deploy_doc:
    concurrency:
      group: pull_request_versioned_doc
      cancel-in-progress: false
    uses: stakater/.github/.github/workflows/pull_request_versioned_doc.yaml@v0.0.188
    secrets:
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
  build_container:
    needs: deploy_doc
    if: ${{ github.base_ref == 'main' }}
    uses: stakater/.github/.github/workflows/pull_request_container_build.yaml@v0.0.131
    with:
      DOCKER_BUILD_CONTEXTS: content=https://github.com/stakater/hibernation-operator-docs.git#pull-request-deployments
      DOCKER_FILE_PATH: Dockerfile
      CONTAINER_REGISTRY_URL: ghcr.io/stakater
    secrets:
      CONTAINER_REGISTRY_USERNAME: ${{ github.actor }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.STAKATER_DELIVERY_SLACK_WEBHOOK }}
      DOCKER_SECRETS: GIT_AUTH_TOKEN=${{ secrets.PUBLISH_TOKEN }}
  test:
    runs-on: ubuntu-latest
    needs: [build_container, deploy_doc]
    # Run inside the official Playwright image so browsers are pre-installed.
    # This avoids `playwright install` downloading Chromium from
    # cdn.playwright.dev at runtime, which hangs indefinitely on the runner.
    # The tag MUST match the @playwright/test version in e2e/yarn.lock.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    # Serve the built docs image as a sibling container on the same job
    # network; it is reachable from the test container at hostname `docs`.
    services:
      docs:
        image: ${{ needs.build_container.outputs.IMAGE_PATH }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
        ports:
          - 8080:8080
    env:
      CURRENT_BRANCH: ${{ needs.deploy_doc.outputs.CURRENT_BRANCH }}
      BASE_URL: http://docs:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for docs site to be ready
        run: |
          timeout 60 bash -c 'until curl -f "http://docs:8080/${CURRENT_BRANCH}/" > /dev/null 2>&1; do sleep 2; done'
          echo "Documentation site is ready!"

      - name: Install dependencies
        working-directory: ./e2e
        run: yarn install --frozen-lockfile

      - name: Run Playwright tests
        working-directory: ./e2e
        run: yarn test --reporter=line